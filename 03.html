function character(s){return `<img draggable="false" alt="쿠로미" src="${arts[s]}">`;}
function tone(f=550,d=.08,type='square'){if(!soundOn)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);o.frequency.exponentialRampToValueAtTime(f*.7,a.currentTime+d);g.gain.setValueAtTime(.055,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);setTimeout(()=>a.close(),300)}catch(e){}}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1900)}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){mode=+$('difficulty').value;let deck=[];for(let i=0;i<8;i++)for(let r=1;r<=13;r++)deck.push({r,s:mode===1?0:mode===2?i%2:i%4,up:false});shuffle(deck);columns=Array.from({length:10},()=>[]);for(let i=0;i<54;i++)columns[i%10].push(deck[i]);columns.forEach(c=>c[c.length-1].up=true);stock=deck.slice(54);completed=[];history=[];selected=null;moves=0;seconds=0;started=false;clearInterval(timer);timer=null;$('overlay').classList.remove('show');render();toast('새 게임 시작! ♡')}
function startTimer(){if(started)return;started=true;timer=setInterval(()=>{seconds++;$('time').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},1000)}
function save(){history.push(JSON.stringify({columns,stock,completed,moves}));if(history.length>100)history.shift()}
function undo(){if(!history.length)return toast('되돌릴 수 없어요');let s=JSON.parse(history.pop());columns=s.columns;stock=s.stock;completed=s.completed;moves=s.moves;selected=null;tone(380);render()}
function isRun(c,i){if(!c[i]||!c[i].up)return false;for(let j=i;j<c.length-1;j++)if(!c[j+1].up||c[j].s!==c[j+1].s||c[j].r!==c[j+1].r+1)return false;return true}
function canMove(src,i,dst){if(src===dst||!isRun(columns[src],i))return false;let t=columns[dst];return !t.length||t[t.length-1].r===columns[src][i].r+1}
function removeRuns(){let changed=true;while(changed){changed=false;for(let c of columns){if(c.length<13)continue;let tail=c.slice(-13);if(tail[0].r===13&&tail.every((v,i)=>v.up&&v.s===tail[0].s&&v.r===13-i)){completed.push(tail[0].s);c.splice(-13);if(c.length)c[c.length-1].up=true;changed=true;tone(840,.22)}}}if(completed.length===8){clearInterval(timer);$('overlay').classList.add('show');tone(1000,.3)}}
function move(src,i,dst){if(!canMove(src,i,dst))return false;save();let cards=columns[src].splice(i);columns[dst].push(...cards);if(columns[src].length)columns[src].at(-1).up=true;moves++;selected=null;startTimer();tone(620);removeRuns();render();return true}
function deal(){if(stock.length<10)return toast('남은 카드가 없어요');if(columns.some(c=>!c.length))return toast('빈 열을 먼저 채워주세요!');save();startTimer();for(let i=0;i<10;i++){let c=stock.pop();c.up=true;columns[i].push(c)}moves++;selected=null;tone(470,.14);removeRuns();render()}
function tap(c,i){let card=columns[c][i];if(selected){let sel=selected;if(sel.c===c&&sel.i===i){selected=null;render();return}if(move(sel.c,sel.i,c))return;if(card&&isRun(columns[c],i)){selected={c,i};tone(490);render();return}selected=null;render();return}if(card&&isRun(columns[c],i)){selected={c,i};tone(490);render()}else toast('같은 무늬로 이어진 카드만 이동할 수 있어요')}
function columnTap(c){if(selected){if(!move(selected.c,selected.i,c))toast('여기로 이동할 수 없어요')}else if(columns[c].length)tap(c,columns[c].length-1)}
function hint(){for(let s=0;s<10;s++)for(let i=0;i<columns[s].length;i++)if(isRun(columns[s],i))for(let d=0;d<10;d++)if(columns[d].length&&canMove(s,i,d)){selected={c:s,i};render();document.querySelectorAll('.column')[d].classList.add('target');toast(`${s+1}번 열 → ${d+1}번 열로 이동!`);tone(790);return}toast('이동할 카드가 없어요. 새 카드를 배분해 보세요!')}
function render(){$('moves').textContent=moves;$('complete').textContent=completed.length+'/8';$('stockCount').textContent=(stock.length/10)+'회 남음';$('stock').disabled=!stock.length;$('undo').disabled=!history.length;$('done').innerHTML=completed.map(s=>`<span title="${names[s]}">${['🎀','💜','🩷','🖤'][s]}</span>`).join('');let root=$('columns');root.innerHTML='';columns.forEach((col,c)=>{let el=document.createElement('div');el.className='column';el.setAttribute('aria-label',`${c+1}번 열`);el.style.minHeight=`${Math.max(440,col.length*parseInt(getComputedStyle(document.documentElement).getPropertyValue('--step'))+120)}px`;el.onclick=e=>{if(e.target===el||e.target.classList.contains('placeholder'))columnTap(c)};if(!col.length){let ph=document.createElement('div');ph.className='placeholder';el.appendChild(ph)}col.forEach((v,i)=>{let card=document.createElement('div');card.className='card '+(v.up?'face':'back')+(selected&&selected.c===c&&i>=selected.i?' selected':'');card.style.top=`calc(${i} * var(--step))`;card.style.zIndex=i+1;card.dataset.col=c;card.dataset.idx=i;card.onclick=e=>{e.stopPropagation();if(suppressClick){e.preventDefault();return}tap(c,i)};card.addEventListener('pointerdown',dragStart);if(!v.up){card.textContent='♡'}else{let rank=({1:'A',11:'J',12:'Q',13:'K'})[v.r]||v.r;card.innerHTML=`<div class="corner" style="color:${colors[v.s]}">${rank}<small>${suits[v.s]}</small></div><div class="faceart">${character(v.s)}</div><div class="cardname">${names[v.s]}</div>`}el.appendChild(card)});root.appendChild(el)})}
let drag=null,suppressClick=false;
function dragStart(e){if(e.button!==0&&e.pointerType==='mouse')return;const card=e.currentTarget,c=+card.dataset.col,i=+card.dataset.idx;if(!isRun(columns[c],i))return;
 drag={c,i,x:e.clientX,y:e.clientY,active:false,ghost:null,target:-1};
 document.addEventListener('pointermove',dragMove);document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragCancel);
}
function dragMove(e){if(!drag)return;const d=drag;if(!d.active&&Math.hypot(e.clientX-d.x,e.clientY-d.y)<8)return;
 if(!d.active){d.active=true;selected=null;const count=columns[d.c].length-d.i;let ghost=document.createElement('div');ghost.className='dragghost';ghost.innerHTML=columns[d.c].slice(d.i).map((v,k)=>{let rank=({1:'A',11:'J',12:'Q',13:'K'})[v.r]||v.r;return `<div class="ghostcard" style="top:${k*20}px"><span style="color:${colors[v.s]}">${rank}${suits[v.s]}</span><img src="${arts[v.s]}"></div>`}).join('');ghost.style.height=`calc(var(--cardh) + ${(count-1)*20}px)`;document.body.appendChild(ghost);d.ghost=ghost;document.querySelectorAll('.column').forEach((el,k)=>{if(k===d.c)el.classList.add('drag-source')});}
 e.preventDefault();d.ghost.style.left=e.clientX+'px';d.ghost.style.top=e.clientY+'px';d.ghost.style.pointerEvents='none';document.querySelectorAll('.column').forEach(el=>el.classList.remove('target'));let hit=document.elementFromPoint(e.clientX,e.clientY);let col=hit?.closest('.column');d.target=col?Array.from($('columns').children).indexOf(col):-1;if(d.target>=0&&canMove(d.c,d.i,d.target))col.classList.add('target');
}
function dragCleanup(){document.removeEventListener('pointermove',dragMove);document.removeEventListener('pointerup',dragEnd);document.removeEventListener('pointercancel',dragCancel);document.querySelectorAll('.column').forEach(el=>el.classList.remove('target','drag-source'));if(drag?.ghost)drag.ghost.remove();drag=null;}
function dragEnd(e){if(!drag)return;const d=drag,was=d.active,target=d.target,src=d.c,idx=d.i;dragCleanup();if(was){suppressClick=true;setTimeout(()=>suppressClick=false,150);if(target<0||!move(src,idx,target)){tone(180,.1);toast('같은 무늬의 내림차순 카드만 옮길 수 있어요');}}}
function dragCancel(){dragCleanup()}
$('new').onclick=newGame;$('undo').onclick=undo;$('hint').onclick=hint;$('stock').onclick=deal;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'♫ ON':'♫ OFF';if(soundOn)tone(600)};$('difficulty').onchange=newGame;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected){selected=null;render()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}});newGame();
</script></body></html>
