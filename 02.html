<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>❄ 치이카와 눈싸움 대작전</title><style>*{box-sizing:border-box}body{margin:0;background:#d9f4ff;font-family:system-ui,'Malgun Gothic',sans-serif;color:#31546b;display:flex;justify-content:center;min-height:100vh}main{width:min(100%,920px);padding:18px}h1{text-align:center;margin:8px 0;font-size:clamp(24px,4vw,36px);color:#397ca1;text-shadow:2px 3px #fff}.sub{text-align:center;margin:4px 0 14px;font-size:13px}section{background:#fff9;border:3px solid white;border-radius:22px;box-shadow:0 8px 0 #a6d4e9;overflow:hidden}.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;flex-wrap:wrap;font-weight:800}.pill{background:#eaf8ff;border-radius:20px;padding:8px 12px}.hp{color:#ed6f89}canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;background:#b9eaff}.bottom{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:14px}button{border:0;border-radius:14px;background:#ff9ab4;color:#fff;font-weight:900;font-size:15px;padding:12px 18px;box-shadow:0 5px #d97796;cursor:pointer}button:active{transform:translateY(4px);box-shadow:0 1px #d97796}button.secondary{background:#7ec7eb;box-shadow:0 5px #58a2c7}.help{text-align:center;font-size:13px;line-height:1.7;margin:18px auto;max-width:680px}.picker{text-align:center;margin:14px auto;background:#ffffffb8;border:2px solid white;border-radius:18px;padding:10px}.picker strong{display:block;margin-bottom:7px}.picker #characters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.charbtn{background:#fff;border:3px solid #e6d6df;border-radius:14px;box-shadow:0 3px #bcb0bc;padding:4px 10px;min-width:66px;color:#526070}.charbtn.active{border-color:#ff83a8;background:#ffe7ee;transform:translateY(-2px)}.charbtn img{width:45px;height:54px;object-fit:contain;display:block;margin:auto}.charbtn span{font-size:11px;display:block}.touch{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:14px auto;max-width:540px}.touch button{min-width:65px;touch-action:none;user-select:none}.touch .fire{background:#ffb65f;box-shadow:0 5px #d28a3a}.overlay{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:#31628b80;z-index:2}.modal{background:#fff;border:5px solid #b5e6ff;border-radius:24px;padding:28px;text-align:center;max-width:90%;box-shadow:0 12px 0 #6aa6c7}.modal h2{font-size:28px;margin:0 0 12px}.wrap{position:relative}#status{font-size:14px;text-align:center;min-height:22px;color:#6d8aa0}@media(min-width:700px){.touch{display:none}}@media(max-width:550px){main{padding:8px}.hud{font-size:12px}.pill{padding:7px}button{font-size:13px;padding:11px}h1{font-size:26px}}</style></head><body><main><h1>❄️ 치이카와 눈싸움 대작전 ⛄</h1><p class="sub">올려주신 다섯 친구와 함께하는 겨울 눈싸움!</p><section><div class="hud"><span class="pill">💗 내 캐릭터 <span id="health" class="hp">♥♥♥♥♥</span></span><span class="pill">⭐ 점수 <span id="score">0</span></span><span class="pill">🏆 최고 <span id="best">0</span></span><span class="pill">🌨️ 레벨 <span id="level">1</span></span></div><div class="wrap"><canvas id="game" width="900" height="510" aria-label="눈싸움 게임 화면"></canvas><div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle">☃️ 다섯 친구의 눈싸움!</h2><p id="modalText">방향키 또는 A/D로 움직이고<br>스페이스바로 눈덩이를 던져요!<br>상대의 눈덩이는 피하세요.</p><button id="start">게임 시작 ▶</button></div></div></div><div class="bottom"><button class="secondary" id="pause">⏸ 일시정지</button><button id="restart">🔄 다시 시작</button><button class="secondary" id="sound">🔊 소리 켜짐</button></div></section><div class="picker"><strong>내 캐릭터 선택</strong><div id="characters"></div></div><div class="touch"><div><button id="left" class="secondary">◀</button> <button id="right" class="secondary">▶</button></div><button id="shoot" class="fire">❄ 던지기!</button></div><p id="status">캐릭터를 선택하고 상대 친구를 맞히면 10점! 눈덩이를 피하며 오래 살아남으세요.</p><p class="help">💻 PC: ← → 또는 A D 이동 · 스페이스 눈덩이 · P 일시정지<br>📱 모바일: 아래 이동 버튼과 던지기 버튼을 누르세요. 화면을 탭해도 눈덩이를 던질 수 있어요.</p></main><script>(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height;const el=id=>document.getElementById(id);let keys={},playing=false,paused=false,score=0,health=5,level=1,last=0,spawn=0,balls=[],foes=[],flakes=[],particles=[],inv=0,shootCD=0,elapsed=0,sound=true;let best=0;try{best=+(localStorage.getItem('snowball-best')||0)}catch(e){}el('best').textContent=best;const player={x:W/2,y:H-95,r:21};const rand=(a,b)=>a+Math.random()*(b-a);let audio;function beep(freq=500,dur=.07,type='square',vol=.035){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}function hud(){el('health').textContent='♥'.repeat(Math.max(0,health))+'♡'.repeat(5-Math.max(0,health));el('score').textContent=score;el('level').textContent=level;el('best').textContent=best}function reset(){score=0;health=5;level=1;elapsed=0;spawn=0;inv=0;shootCD=0;balls=[];foes=[];particles=[];player.x=W/2;paused=false;playing=true;el('overlay').style.display='none';el('pause').textContent='⏸ 일시정지';hud();beep(650,.1)}function end(){playing=false;el('modalTitle').textContent='☃️ 눈싸움 종료!';el('modalText').innerHTML=`최종 점수 <b>${score}점</b>!<br>레벨 ${level}까지 도전했어요.<br>다시 한번 놀아볼까요?`;el('start').textContent='다시 도전 ▶';el('overlay').style.display='flex';beep(230,.3)}function fire(){if(!playing||paused||shootCD>0)return;balls.push({x:player.x,y:player.y-20,vx:0,vy:-470,r:9,enemy:false});shootCD=.24;beep(670,.055,'triangle')}function burst(x,y,col,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-140,140),vy:rand(-170,50),life:rand(.3,.7),color:col})}function hit(){if(inv>0)return;health--;inv=1.1;burst(player.x,player.y,'#ff91aa',16);beep(170,.25,'sawtooth');hud();if(health<=0)end()}function snow(x,y,r=8){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.fillStyle='#b8e4fa';ctx.beginPath();ctx.arc(x-r*.2,y-r*.2,r*.23,0,7);ctx.fill()}const spriteData=['data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJAAAACaCAYAAABG3cHeAACfnUlEQVR42uy9d7hkV3Hu/Vtr584np8k5B8XRjCLKkSxASCZIIDA2xhn72tfGYGMbY4MBY3IQSQRFUEAaoTDSaJRGGkmTczw5dNxxre+P3efMDBK2AV9f7vN8rWerz5zQ3Xuv2rWq3nrrLRFu3MD///h/5yE1qDgBQAgBUiCEQIn05wqN0PqkvxFao7UGpRFKY0oDLUAZAiXTA0AqMBQYGlAnvgAoQfo34uTPY/7/S/L/oBFNfqE1WoFGI6QAoRGAKSd/Q6WGI1IrEFKkBpgkCARgTBmYArTWaADd/Ht9/B3lpE0JTrKuX8mAtJi07FfeHb/o8fOW+5/dZb/s45d5/V/38Wrn/ws/s9AoRHM1BFpohD7+PPn9X8qATBOhNYlODUY3PY4QAlMIkiRp2tekK5FICQgDLTQqFghEajD65E8wZXAnflP8nAcUr2LMv8zF00JPHek7aSQa0TwM00AlMYHfaFFJjOG4WF6m2xSSoN6YrbVCCJBoVBwRBT5JFGKZBlYue7ohBVolqCROXw/QUUTs+zIJAgxEegiBkS4LEo3WKj0EJx3paZ54/HrGM3XW4vhFFRoMrTG0RgchOoqQSiHRmFIgjcm3n7x2aurfQoAQYDQP2Tyfk6/58S1EoUkEIJtbmCHRUqAQJBqQBkgDYZgIw0IYJloYKNLfEZYFpgnSQP7cf0iDRICSx49EKhKp0EKhhDr5/vhlY6BJA1JCYah0MQx9/I6UGoIgkI7jKCwLncTUa415sUpOcxzne07GI4hCTNPANKz0IihNHIXEQUSi4mI2m5+I4xAda0zLQEgTtAIh098PIxAqdbXNC6rFcceqhfg5J/DzRqN+bQOavDEnzzl9bv5EqdQipJ6KHWI0iU63FNu2T/gox72I/LnPqU649bU4yan9xjx+9RhIy1+4lTheRgHoOEEBVsbdbUmxW2CQIKiH0QoRhb6U0U7TlFjSQkiJcBykMiYSBIkQYEi0YaARxElCHEdIrXBNs3lF071bCAGC5r6exgb/XQbzyz0mXVLz2ggJEpROfZYQAi0gSfSU8Uw+a62Rzc9pGtYrtgfFb+bjVzagnz85eeJdYproJCZRCiXAMG20gEglhIGPk81t0ZMLD0STC24AhkGgNFGS3smxkEipURhgGggJcZIg0Kk3aq6bEGLKgLT+P3eLihNig1d4gslMSKXbkm5eEGmaCKGRQgKayA/TgLd5E0gh059r8Z/Ghf+Tsd7/WQ/0qvd4enZBtYbtuZhexgyjMJ6o1ZcmWi1ws5nbc6WWq0ar1f3SMqUljbJSyo/iuD2O42VaqRYAz/O+l5hGyUAcwrYtIWRWRdFwHMcyUkq5UiK1mjIYwXHj+R/xM/oXXYP0tkq0RqOaTlJDosGY9JAaIQykSJ+F1GlEJzWymRXFcdw0GvXKYP03zIh+pRiIZswh9M9f0PTM4kQ34xIDwzKRlimFab1Ga12OtAr2Hj70/EStzsjQMENDQ4yPj9NoNBA6dfOmaVIsFpk1YyZz586lq6PzMtM050dR9DJx
